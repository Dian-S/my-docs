site_name: ZF_APOC2 Dataset Documentation
theme:
  name: material
  language: zh  # 设置中文
  features:
    - navigation.tabs # 顶部横向导航
    - navigation.sections # 侧边栏分组
    - search.suggest # 搜索建议
    - content.code.copy # 代码块复制按钮
  palette: 
    primary: indigo # 主题颜色
    accent: indigo

# 目录结构配置
nav:
  - Overview: overview.md
  - Data: data_structure.md
  - Workflow: bodipy_sam_workflow.md
  - Download & Usage: download_usage.md
  - Article context: article_context.md
  - Citation: citation.md