name: publish site
on:
  push:
    branches:
      - main  # 监听主分支代码推送
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material 
      - run: mkdocs gh-deploy --force # 自动构建并推送到 gh-pages 分支